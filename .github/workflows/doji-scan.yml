name: Doji Crypto Scan

on:
  workflow_dispatch:

concurrency:
  group: doji-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Doji scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/scan.js

      - name: Save Trades Cache
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add src/trades.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update trades cache [skip ci]" && git pull --rebase origin main && git push)
